<div class="container-fluid change-password-page">
  <div class="row justify-content-start align-items-center min-vh-100">
    <div class="col-lg-5 col-md-8 col-sm-11">
      <div class="change-password-card">
        <div class="icon-circle">
          <i class="fa-solid fa-key"></i>
        </div>

        <h2 class="title">تغيير كلمة المرور</h2>
        <p class="subtitle">قم بتحديث كلمة المرور الخاصة بك بأمان</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <!-- Current Password -->
          <div class="mb-4 text-end">
            <label class="form-label">كلمة المرور الحالية</label>
            <div class="input-group">
              <input
                formControlName="currentPassword"
                [type]="showCurrent ? 'text' : 'password'"
                class="form-control custom-input"
                placeholder="أدخل كلمة المرور الحالية"
              />
              <span
                class="input-group-text bg-white"
                style="cursor: pointer"
                (click)="showCurrent = !showCurrent"
              >
                <i
                  [class]="
                    showCurrent
                      ? 'fa-regular fa-eye'
                      : 'fa-regular fa-eye-slash'
                  "
                ></i>
              </span>
            </div>
            <small
              class="text-danger"
              *ngIf="cur.touched && cur.hasError('required')"
            >
              هذا الحقل مطلوب
            </small>
          </div>

          <!-- New Password -->
          <div class="mb-4 text-end">
            <label class="form-label">كلمة المرور الجديدة</label>
            <div class="input-group">
              <input
                formControlName="newPassword"
                [type]="showNew ? 'text' : 'password'"
                class="form-control custom-input"
                placeholder="أدخل كلمة المرور الجديدة"
              />
              <span
                class="input-group-text bg-white"
                style="cursor: pointer"
                (click)="showNew = !showNew"
              >
                <i
                  [class]="
                    showNew ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash'
                  "
                ></i>
              </span>
            </div>
            <small
              class="text-danger"
              *ngIf="nw.touched && nw.hasError('required')"
            >
              هذا الحقل مطلوب
            </small>
            <small
              class="text-danger"
              *ngIf="nw.touched && nw.hasError('minlength')"
            >
              يجب أن تكون 8 أحرف على الأقل
            </small>
          </div>

          <!-- Confirm Password -->
          <div class="mb-4 text-end">
            <label class="form-label">تأكيد كلمة المرور الجديدة</label>
            <div class="input-group">
              <input
                formControlName="confirmPassword"
                [type]="showConfirm ? 'text' : 'password'"
                class="form-control custom-input"
                placeholder="أعد إدخال كلمة المرور الجديدة"
              />
              <span
                class="input-group-text bg-white"
                style="cursor: pointer"
                (click)="showConfirm = !showConfirm"
              >
                <i
                  [class]="
                    showConfirm
                      ? 'fa-regular fa-eye'
                      : 'fa-regular fa-eye-slash'
                  "
                ></i>
              </span>
            </div>
            <small
              class="text-danger"
              *ngIf="conf.touched && form.hasError('mismatch')"
            >
              كلمة المرور غير متطابقة
            </small>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="btn change-btn w-100"
            [disabled]="loading"
          >
            {{ loading ? "جارٍ التحديث..." : "تحديث كلمة المرور" }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
