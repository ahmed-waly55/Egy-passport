<div class="ai-card" dir="rtl">
  <div class="px-4 pt-4 pb-2">
    <h6 class="section-title">
      <i class="fa-solid fa-circle-info me-2"></i>
      معلومات إضافية
    </h6>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border spinner-border-sm" role="status"></div>
  </div>

  <div class="px-4 pb-4" *ngIf="!loading">
    <div class="row gy-3 gx-4">
      <!-- جهة العمل — not in API, static -->
      <div class="col-12 col-md-6">
        <div class="info-item">
          <div class="info-icon-wrap">
            <i class="fa-solid fa-building"></i>
          </div>
          <div class="info-content">
            <span class="info-label">جهة العمل</span>
            <span class="info-value">—</span>
          </div>
        </div>
      </div>

      <!-- تاريخ التسجيل — from API -->
      <div class="col-12 col-md-6">
        <div class="info-item">
          <div class="info-icon-wrap">
            <i class="fa-regular fa-calendar-check"></i>
          </div>
          <div class="info-content">
            <span class="info-label">تاريخ التسجيل</span>
            <span class="info-value">
              {{ me?.createdAt | date: "d MMMM yyyy" }} || "—"
            </span>
          </div>
        </div>
      </div>

      <!-- فصيلتم — not in API, static -->
      <div class="col-12 col-md-6">
        <div class="info-item">
          <div class="info-icon-wrap">
            <i class="fa-solid fa-user-group"></i>
          </div>
          <div class="info-content">
            <span class="info-label">فصيلتم</span>
            <span class="info-value">
              <span class="badge-count">0+</span>
            </span>
          </div>
        </div>
      </div>

      <!-- المهنة — not in API, static -->
      <div class="col-12 col-md-6">
        <div class="info-item">
          <div class="info-icon-wrap">
            <i class="fa-solid fa-briefcase"></i>
          </div>
          <div class="info-content">
            <span class="info-label">المهنة</span>
            <span class="info-value">—</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
