<div class="top-bar d-flex justify-content-between align-items-center bg-white">
  <div class="logo">
    <img src="images/logo.png" alt="" />
  </div>
  <div class="options d-flex gap-4 ms-3 align-items-center">
    <button
      (click)="toggleNavigationMenue()"
      aria-label="menu"
      class="menu bg-transparent border-0"
    >
      <i class="fa-solid fa-bars"></i>
    </button>
    <button
      class="notifacations bg-transparent border-0 position-relative d-flex justify-content-center align-items-center"
    >
      <span
        class="fw-bold position-absolute d-flex justify-content-center align-items-center"
        >2</span
      >
      <i class="fa-regular fa-bell"></i>
    </button>
    <button class="language bg-transparent pt-1 px-3">
      <i class="fa-solid fa-globe"></i>English
    </button>
  </div>
</div>
